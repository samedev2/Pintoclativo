# ByteTrack para o video de cima do pinteiro (camera fixa, cercado fechado).
# As deteccoes ja chegam filtradas (copos, fios e fundo removidos), entao os limiares
# podem ser baixos: aves brancas e pintos tem confianca menor no pinteiro.pt.
tracker_type: bytetrack
track_high_thresh: 0.20
track_low_thresh: 0.08
new_track_thresh: 0.25
track_buffer: 150
match_thresh: 0.85
fuse_score: True
